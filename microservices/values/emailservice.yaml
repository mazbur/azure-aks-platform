deployment:
  name: emailservice
  containerImage: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.1

  containerPorts:
    - containerPort: 8080
      protocol: TCP

  containerReadinessProbe:
    periodSeconds: 5
    exec:
      command: ["/bin/grpc_health_probe", "-addr=:8080", "-connect-timeout=5s"]

  containerLivenessProbe:
    periodSeconds: 5
    exec:
      command: ["/bin/grpc_health_probe", "-addr=:8080", "-connect-timeout=5s"]

  envVariables:
    - name: PORT
      value: "8080"
    - name: DISABLE_PROFILER
      value: "1"

  containerResources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      protocol: TCP
