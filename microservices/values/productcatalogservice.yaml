deployment:
  name: productcatalogservice
  containerImage: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.1

  containerPorts:
    - containerPort: 3550
      protocol: TCP

  containerReadinessProbe:
    exec:
      command: ["/bin/grpc_health_probe", "-addr=:3550"]

  containerLivenessProbe:
    exec:
      command: ["/bin/grpc_health_probe", "-addr=:3550"]

  envVariables:
    - name: PORT
      value: "3550"
    - name: DISABLE_PROFILER
      value: "1"

  containerResources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: grpc
      port: 3550
      targetPort: 3550
      protocol: TCP
