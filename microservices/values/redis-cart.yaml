deployment:
  name: redis-cart
  containerImage: redis:alpine

  # Redis writes to disk so readOnlyRootFilesystem must be false
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: false

  containerPorts:
    - containerPort: 6379
      protocol: TCP

  containerReadinessProbe:
    periodSeconds: 5
    tcpSocket:
      port: 6379

  containerLivenessProbe:
    periodSeconds: 5
    tcpSocket:
      port: 6379

  # No envVariables — redis uses its default config

  containerResources:
    requests:
      cpu: 70m
      memory: 200Mi
    limits:
      cpu: 125m
      memory: 256Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
      protocol: TCP
