deployment:
  name: currencyservice
  containerImage: us-central1-docker.pkg.dev/google-samples/microservices-demo/currencyservice:v0.10.1

  containerPorts:
    - containerPort: 7000
      protocol: TCP

  containerReadinessProbe:
    initialDelaySeconds: 5
    exec:
      command: ["/bin/grpc_health_probe", "-addr=:7000"]

  containerLivenessProbe:
    initialDelaySeconds: 5
    exec:
      command: ["/bin/grpc_health_probe", "-addr=:7000"]

  envVariables:
    - name: PORT
      value: "7000"
    - name: DISABLE_PROFILER
      value: "1"

  containerResources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: grpc
      port: 7000
      targetPort: 7000
      protocol: TCP
